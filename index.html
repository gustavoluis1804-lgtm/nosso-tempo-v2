<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#141416" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Juntos há" />
  <title>Juntos há</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="screen" aria-label="Contador de tempo juntos">
    <section class="top">
      <p id="dateLabel" class="date">sábado, 12 de setembro</p>
      <div id="clock" class="clock" aria-label="Horário atual">00:00</div>

      <div class="counter-card" aria-live="polite">
        <div class="counter-title">Juntos há <span class="heart" aria-hidden="true">♡</span></div>
        <div class="counter-grid">
          <div class="unit">
            <strong id="days">00</strong>
            <span>DIAS</span>
          </div>
          <div class="separator">:</div>
          <div class="unit">
            <strong id="hours">00</strong>
            <span>HORAS</span>
          </div>
          <div class="separator">:</div>
          <div class="unit">
            <strong id="minutes">00</strong>
            <span>MIN</span>
          </div>
          <div class="separator">:</div>
          <div class="unit">
            <strong id="seconds">00</strong>
            <span>SEG</span>
          </div>
        </div>
      </div>
    </section>

    <button id="fullscreenBtn" class="fullscreen-btn" type="button">Tela cheia</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
