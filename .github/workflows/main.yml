name: Gerar APK - Juntos Há

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Criar package.json
        run: npm init -y

      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core
          npm install -D @capacitor/cli
          npm install @capacitor/android

      - name: Preparar arquivos do site
        run: |
          mkdir -p www
          cp index.html www/
          cp styles.css www/
          cp app.js www/
          cp manifest.json www/
          cp sw.js www/

      - name: Configurar Capacitor
        run: |
          npx cap init "Juntos Há" "com.gustavo.juntosha" --web-dir=www

      - name: Adicionar Android
        run: npx cap add android

      - name: Sincronizar projeto
        run: npx cap sync android

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Juntos-Ha-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
